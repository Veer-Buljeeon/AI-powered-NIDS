micronaut.application.name=api

# Flask detection engine (Phase 3) as a named HTTP service. Base URL overridable
# via the DETECTION_ENGINE_URL environment variable; never hardcoded.
micronaut.http.services.detection.url=${DETECTION_ENGINE_URL:`http://localhost:5000`}
micronaut.http.services.detection.read-timeout=5s

# Allow the Phase 5 browser dashboard (served from another origin) to call the API.
micronaut.server.cors.enabled=true
