<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-NIDS Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Zone 1: header status -->
<header>
  <div>
    <h1>AI-Powered <span>NIDS</span></h1>
    <div class="sub">Live network intrusion monitoring</div>
  </div>
  <div class="pills">
    <span id="api-status" class="pill">API: checking&hellip;</span>
    <span id="ws-status" class="pill">Live feed: connecting&hellip;</span>
  </div>
</header>

<main>
  <!-- Zone 2: stats summary -->
  <section class="stats-grid">
    <div class="card"><div class="label">Total alerts</div><div class="value" id="stat-total">0</div></div>
    <div class="card high"><div class="label">High</div><div class="value" id="stat-high">0</div></div>
    <div class="card medium"><div class="label">Medium</div><div class="value" id="stat-medium">0</div></div>
    <div class="card benign"><div class="label">Benign</div><div class="value" id="stat-benign">0</div></div>
    <div class="card"><div class="label">Last alert</div><div class="value small" id="stat-last">&mdash;</div></div>
  </section>

  <!-- Zone 3: charts -->
  <section class="charts-grid">
    <div class="panel">
      <h2>Alerts by severity</h2>
      <div class="chart-wrap"><canvas id="chart-severity"></canvas></div>
    </div>
    <div class="panel">
      <h2>Alerts by class</h2>
      <div class="chart-wrap tall"><canvas id="chart-class"></canvas></div>
    </div>
    <div class="panel">
      <h2>Alerts over time</h2>
      <div class="chart-wrap"><canvas id="chart-time"></canvas></div>
    </div>
  </section>

  <!-- Zone 4: live alert feed -->
  <section class="panel">
    <h2>Live alert feed</h2>
    <div id="feed" class="feed"></div>
  </section>

  <section class="panel">
    <h2>Alert history</h2>
    <table class="history">
      <thead><tr><th>Time</th><th>Severity</th><th>Class</th><th>Confidence</th><th>Source IP</th><th>Dest port</th></tr></thead>
      <tbody id="history-body"></tbody>
    </table>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script src="js/severity.js"></script>
<script src="js/WebSocketClient.js"></script>
<script src="js/StatsPoller.js"></script>
<script src="components/AlertFeedRenderer.js"></script>
<script src="components/AlertHistoryTable.js"></script>
<script src="components/ChartManager.js"></script>
<script src="js/app.js"></script>
</body>
</html>
